<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="intro">
      <p>Enter the frame</p>
    </section>
    <section class="sticky-cards">
      <div class="card" id="card-1">
        <div class="col">
          <p>Quiet control</p>
          <h1>signal drift</h1>
        </div>
        <div class="col">
          <img
            src="https://picsum.photos/seed/card1/640/960"
            alt="test image 1"
          />
        </div>
      </div>
      <div class="card" id="card-2">
        <div class="col">
          <p>Soft motion</p>
          <h1>frame delay</h1>
        </div>
        <div class="col">
          <img
            src="https://picsum.photos/seed/card2/640/960"
            alt="test image 2"
          />
        </div>
      </div>
      <div class="card" id="card-3">
        <div class="col">
          <p>Held light</p>
          <h1>still field</h1>
        </div>
        <div class="col">
          <img
            src="https://picsum.photos/seed/card3/640/960"
            alt="test image 3"
          />
        </div>
      </div>
      <div class="card" id="card-4">
        <div class="col">
          <p>Last pulse</p>
          <h1>loop close</h1>
        </div>
        <div class="col">
          <img
            src="https://picsum.photos/seed/card4/640/960"
            alt="test image 4"
          />
        </div>
      </div>
    </section>
    <section class="outro">
      <h1>loop completed</h1>
    </section>
  </body>
</html>
