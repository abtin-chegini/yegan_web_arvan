<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Stack Slider</title>
    <link rel="stylesheet" href="./tech_stack.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Manrope", sans-serif;
        background: #fcf6ef;
      }

      /* Standalone demo aliases mapped to scoped production classes */
      .slider {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: hidden;
        touch-action: none;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        border-radius: 0.75rem;
        will-change: transform, width, height;
      }

      .slide-blank {
        width: 100%;
        height: 100%;
        background: #e8e0d4;
      }

      p#slide-title {
        position: absolute;
        bottom: 25svh;
        left: 50%;
        z-index: 200;
        transform: translateX(-50%);
        color: #1d3557;
        font-weight: 500;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <section class="slider">
      <div class="tech-stack-slider__nav">
        <button type="button" class="tech-stack-slider__nav-btn" data-tech-prev aria-label="Previous slide">
          ‹
        </button>
        <p id="slide-title">Slide Title</p>
        <button type="button" class="tech-stack-slider__nav-btn" data-tech-next aria-label="Next slide">
          ›
        </button>
      </div>
    </section>
    <script type="module" src="./script.js"></script>
  </body>
</html>
